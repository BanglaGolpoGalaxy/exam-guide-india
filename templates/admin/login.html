{% extends "base.html" %}
{% block title %}Admin Login | Exam Guide India{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
{% endblock %}

{% block content %}
<div class="admin-login-page">
    <div class="admin-login-card">
        <div class="admin-login-logo">
            <span class="logo-emoji">🔐</span>
            <h1>Exam Guide India</h1>
            <p>Admin Panel</p>
        </div>

        {% if error %}
        <div class="admin-login-error">⚠️ {{ error }}</div>
        {% endif %}

        <form class="admin-login-form" method="POST" action="{{ url_for('admin.admin_login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter admin username"
                       autocomplete="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter admin password"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" class="admin-login-btn">🔑 Log In to Admin Panel</button>
        </form>

        <div class="admin-login-back">
            <a href="/">← Back to Public Site</a>
        </div>
    </div>
</div>
{% endblock %}
